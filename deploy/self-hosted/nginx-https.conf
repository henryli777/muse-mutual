# Replace the HTTP-only configuration after the certificate is issued.
server {
    listen 80;
    server_name muse.coinexo.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 308 https://muse.coinexo.top$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name muse.coinexo.top;

    ssl_certificate /etc/letsencrypt/live/muse.coinexo.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muse.coinexo.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MUSE_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:4326;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
